[project]
name = "cv-extraction-evals"
version = "0.1.0"
description = "Evals for LLM structured extraction from CVs: accuracy, cost and latency across providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "anthropic>=0.70",
    "openai>=1.100",
    "google-genai>=1.30",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Only needed to re-render the synthetic CVs; the rendered files are committed.
render = ["reportlab>=4.2", "pypdfium2>=4.30", "pillow>=10.4"]

[project.scripts]
evals = "cv_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

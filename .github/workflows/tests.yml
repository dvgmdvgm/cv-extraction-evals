name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Scoring unit tests + an offline end-to-end run with the fake provider (no API keys, no cost).
      - run: uv run pytest -q
